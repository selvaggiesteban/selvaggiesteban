<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <pattern id="dots" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <circle cx="280" cy="220" r="260" fill="#f59e0b" opacity="0.10" filter="url(#blur1)"/>
  <circle cx="1320" cy="680" r="240" fill="#d97706" opacity="0.12" filter="url(#blur1)"/>
  <circle cx="800" cy="740" r="150" fill="#f59e0b" opacity="0.07" filter="url(#blur2)"/>

  <g transform="translate(736, 180)" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <rect x="4" y="4" width="120" height="88" rx="10" stroke-width="4"/>
    <polyline points="28,34 52,54 28,74"/>
    <line x1="64" x2="96" y1="76" y2="76"/>
  </g>

  <text x="800" y="460" text-anchor="middle" fill="#f8fafc" font-size="86" font-weight="bold">Claude Code</text>
  <text x="800" y="530" text-anchor="middle" fill="#fde68a" font-size="36" font-weight="600">Commands</text>

  <rect x="700" y="580" width="200" height="6" rx="3" fill="url(#accent)"/>

  <text x="800" y="862" text-anchor="middle" fill="#94a3b8" font-size="20" font-family="monospace">selvaggiesteban.dev/en/blog/claude-code-commands</text>
</svg>
