<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <circle cx="200" cy="180" r="200" fill="#8b5cf6" opacity="0.12" filter="url(#blur1)"/>
  <circle cx="1000" cy="450" r="180" fill="#6366f1" opacity="0.12" filter="url(#blur1)"/>
  <circle cx="600" cy="500" r="120" fill="#a78bfa" opacity="0.06" filter="url(#blur2)"/>

  <!-- Icon: chat bubble with spark -->
  <g transform="translate(536, 96)" stroke="#a78bfa" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <svg width="128" height="128" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-4 4v-4H6a2 2 0 0 1-2-2z"/><path d="M12 6.5l.9 1.9 1.9.9-1.9.9-.9 1.9-.9-1.9-1.9-.9 1.9-.9z"/></svg>
  </g>

  <!-- Title -->
  <text x="600" y="300" text-anchor="middle" fill="#f8fafc" font-size="38" font-weight="bold">11 LLM Projects in Production</text>

  <!-- Subtitle -->
  <text x="600" y="338" text-anchor="middle" fill="#c7d2fe" font-size="18">DoorDash &middot; American Express &middot; Microsoft</text>

  <!-- Accent line -->
  <rect x="480" y="368" width="240" height="4" rx="2" fill="url(#accent)"/>

  <!-- Bottom tag -->
  <text x="600" y="598" text-anchor="middle" fill="#475569" font-size="14" font-family="monospace">selvaggiesteban.dev/blog/llm-projects-in-production</text>
</svg>
